name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Prepare Web Directory & Install Dependencies
      run: |
        mkdir -p www
        cp index.html manifest.json sw.js icon-192.png icon-512.png www/ 2>/dev/null || true
        
        npm init -y
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/push-notifications@5
        
        npx cap init "Job Syria" "com.job.syria" --web-dir www
        npx cap add android

    - name: Setup Firebase Config
      run: |
        if [ -f "google-services.json" ]; then
          cp google-services.json android/app/google-services.json
          sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.0'" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
        else
          echo "Warning: google-services.json not found in root directory!"
        fi

    - name: Setup Android Icons
      run: |
        # 1. تثبيت أداة معالجة الصور ImageMagick
        sudo apt-get update && sudo apt-get install -y imagemagick

        # 2. تحديد الصورة المصدر
        ICON_SRC="icon-512.png"
        [ -f "$ICON_SRC" ] || ICON_SRC="icon-192.png"

        RES_PATH="android/app/src/main/res"

        if [ -f "$ICON_SRC" ]; then
          echo "Processing icon from $ICON_SRC..."

          # حذف أيقونات Adaptive XML الافتراضية كي لا تتغلب على الصور
          rm -rf $RES_PATH/mipmap-anydpi-v26

          # دالة لتوليد وتغيير حجم الأيقونات بدقة لكل الكثافات
          generate_icons() {
            DIR_NAME=$1
            SIZE=$2
            
            mkdir -p "$RES_PATH/$DIR_NAME"
            
            # تغيير الحجم وحفظ الأيقونات الأساسية والدائرية وأيقونات الواجهة (Foreground)
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$RES_PATH/$DIR_NAME/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$RES_PATH/$DIR_NAME/ic_launcher_round.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" "$RES_PATH/$DIR_NAME/ic_launcher_foreground.png"
          }

          # توليد الأيقونات بالحجم البرمجي الدقيق المعتمد في أندرويد
          generate_icons "mipmap-mdpi" "48"
          generate_icons "mipmap-hdpi" "72"
          generate_icons "mipmap-xhdpi" "96"
          generate_icons "mipmap-xxhdpi" "144"
          generate_icons "mipmap-xxxhdpi" "192"

          echo "Icons created and resized successfully."
        else
          echo "Warning: No icon file found (icon-512.png or icon-192.png). Default icon will be used."
        fi

    - name: Add Permissions to AndroidManifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>' $MANIFEST_PATH
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" \/>' $MANIFEST_PATH

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Sync & Build Android
      run: |
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: JobSyria-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
