<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Job Syria</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #171717;
            --gold: #d4af37;
            --gold-hover: #f3cf55;
            --text-color: #f5f5f5;
            --text-secondary: #aaaaaa;
            --border-color: #262626;
            --green: #2e7d32;
            --red: #c62828;
            --input-bg: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 18px;
            color: var(--gold);
            font-weight: bold;
        }

        .online-count {
            font-size: 12px;
            color: var(--text-secondary);
            background: #222;
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .page {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 70px;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        /* Auth Styles */
        .auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            gap: 15px;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--gold);
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        input:focus, select:focus {
            border-color: var(--gold);
        }

        button {
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
            background-color: var(--gold-hover);
        }

        button.secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        /* Chat Styles */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
            padding-right: 5px;
        }

        .msg {
            background-color: var(--card-bg);
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            word-break: break-word;
            border: 1px solid var(--border-color);
            position: relative;
            font-size: 14px;
            line-height: 1.4;
        }

        .msg-user {
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }

        .msg-green {
            color: #20e070 !important;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            background: var(--card-bg);
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input-container input {
            margin-bottom: 0;
        }

        .chat-input-container button {
            width: auto;
            padding: 0 15px;
            margin-bottom: 0;
        }

        .chat-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
            cursor: pointer;
        }

        .chat-link {
            color: #3498db;
            text-decoration: underline;
        }

        /* Navigation Bar */
        nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            position: relative;
            width: 25%;
            padding: 5px 0;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 3px;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 22px;
            width: 8px;
            height: 8px;
            background-color: var(--red);
            border-radius: 50%;
        }

        /* Cards & Admin Panels */
        .card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .admin-card {
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        /* Context Menu */
        .custom-context-menu {
            position: absolute;
            background-color: #222;
            border: 1px solid var(--gold);
            border-radius: 6px;
            padding: 5px 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .context-menu-item {
            padding: 8px 15px;
            font-size: 12px;
            color: #fff;
            cursor: pointer;
        }

        .context-menu-item:hover {
            background-color: var(--gold);
            color: #000;
        }

        #monitor {
            background: #050505;
            color: #00ff00;
            font-family: monospace;
            font-size: 10px;
            padding: 8px;
            height: 80px;
            overflow-y: auto;
            border-radius: 6px;
            border: 1px solid #222;
            margin-top: 10px;
            direction: ltr;
            text-align: left;
        }

        .option-broadcast {
            background-color: #332200;
            color: var(--gold);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <h1>Job Syria</h1>
        <div class="online-count">الموظفين: <span id="employee-online-count">0</span></div>
    </header>

    <!-- SECTION: AUTHENTICATION -->
    <div id="auth-section" class="page">
        <div class="auth-container">
            <div class="auth-logo">
                <img src="https://i.ibb.co/23cTDk18/1782795963942.png" alt="Logo">
            </div>

            <div id="credentials-inputs">
                <input type="email" id="email" placeholder="البريد الإلكتروني">
                <input type="password" id="password" placeholder="كلمة المرور (8 خانات أو أكثر)">
                <button id="submit-auth-btn" onclick="submitAuth()">تسجيل الدخول</button>
                <button id="toggle-auth-btn" class="secondary" onclick="toggleAuthMode()">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
            </div>

            <div id="username-inputs" class="hidden">
                <input type="text" id="username" placeholder="اختر اسم مستعار فريد">
                <button onclick="saveUsername()">تأكيد ودخول التطبيق</button>
            </div>
        </div>
    </div>

    <!-- SECTION: MAIN APP (PAGES) -->
    <div id="main-section" class="hidden" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        
        <!-- PAGE 1: PUBLIC CHAT -->
        <div id="page-chat" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-size: 12px; color: var(--text-secondary);">حالة الدردشة العامة: <strong id="chat-status-lbl">مفتوحة 🔓</strong></span>
                <button id="toggle-chat-btn" class="hidden" onclick="toggleChatLockState()" style="width: auto; padding: 4px 10px; font-size: 11px;">قفل الدردشة 🔒</button>
            </div>
            <div id="chat-box" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="msg-text" placeholder="اكتب رسالتك..." onfocus="checkChatInputFocus()">
                <button id="send-msg-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>

        <!-- PAGE 2: PRIVATE SUPPORT CHAT -->
        <div id="page-support" class="page hidden">
            <div class="card" style="margin-bottom: 8px; padding: 8px 12px;">
                <label id="support-selector-label" style="font-size: 11px; color: var(--gold); display: block; margin-bottom: 4px;">اختر جهة التواصل:</label>
                <select id="support-room-selector" onchange="changeSupportActiveRoom(this.value)" style="margin-bottom: 0; padding: 6px; font-size: 12px;">
                </select>
            </div>

            <div id="support-box" class="chat-box"></div>

            <div class="chat-input-container">
                <label for="image-upload" style="cursor: pointer; display: flex; align-items: center; padding: 0 8px; background: #222; border-radius: 6px; border: 1px solid #333;">
                    📷
                </label>
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <input type="text" id="support-msg-text" placeholder="اكتب رسالة خاصة...">
                <button onclick="sendSupportMessage()">إرسال</button>
            </div>
        </div>

        <!-- PAGE 3: ADMIN & MANAGEMENT PANEL -->
        <div id="page-admin" class="page hidden">
            <div class="card">
                <div class="card-title">🛡️ لوحة التحكم والإدارة</div>
                <div id="chat-admin-panel" class="hidden" style="margin-bottom: 10px;">
                    <button onclick="toggleChatLockState()" class="secondary" style="font-size: 12px; padding: 8px;">التحكم بقفل/فتح الدردشة العامة</button>
                </div>
            </div>

            <div class="card-title">📋 قائمة الموظفين والمستخدمين</div>
            <div id="employees-list"></div>
        </div>

        <!-- PAGE 4: SETTINGS & PROFILE -->
        <div id="page-settings" class="page hidden">
            <div class="card">
                <div class="card-title">👤 البيانات الشخصية</div>
                <input type="text" id="new-username" placeholder="الاسم المستعار">
                <button onclick="updateUsername()" style="margin-bottom: 15px;">تحديث الاسم</button>

                <div class="card-title">💳 حساب سيريتل كاش</div>
                <input type="text" id="syriatel-cash-input" placeholder="أدخل رقم أو رمز سيريتل كاش">
                <button onclick="updateSyriatelCash()">حفظ الرمز</button>
            </div>

            <div class="card">
                <div class="card-title">💰 الراتب والمكافآت</div>
                <div style="font-size: 13px; margin-bottom: 6px;">الراتب الحالي: <strong id="my-salary" style="color: var(--gold);">0</strong> ل.س</div>
                <div style="font-size: 13px; margin-bottom: 12px;">عدد الإحالات الناجحة: <strong id="my-referrals-count" style="color: var(--gold);">0</strong></div>
                <button onclick="copyReferralLink()" class="secondary">🔗 نسخ رابط الإحالة الخاص بي</button>
            </div>

            <div class="card">
                <div class="card-title">📡 المراقبة الفنية وشبكة الإشعارات</div>
                <button onclick="copyFcmTokenFromMonitor()" style="font-size: 11px; padding: 6px; margin-bottom: 8px;">نسخ FCM Token</button>
                <div id="monitor">> جاري تهيئة النظام...</div>
            </div>

            <button onclick="logout()" style="background-color: var(--red); color: white; margin-top: 10px;">تسجيل الخروج</button>
        </div>

        <!-- NAVIGATION BOTTOM BAR -->
        <nav>
            <div class="nav-item active" id="nav-chat" onclick="switchPage('chat')">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                الدردشة
            </div>
            <div class="nav-item" id="nav-support" onclick="switchPage('support')">
                <div id="support-badge" class="badge hidden"></div>
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg>
                الدعم
            </div>
            <div class="nav-item hidden" id="nav-admin" onclick="switchPage('admin')">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8s0 0 0 0z"/></svg>
                الإدارة
            </div>
            <div class="nav-item" id="nav-settings" onclick="switchPage('settings')">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                الإعدادات
            </div>
        </nav>
    </div>
</div>

<script>
    let activeContextMenu = null;
    let latestCapturedFcmToken = ""; 

    if ("Notification" in window) {
        if (Notification.permission === "default") {
            Notification.requestPermission().then(permission => {
                if(permission === "granted") {
                    setupPushToken();
                }
            });
        }
    }

    const bannedWords = ["كلب", "سني", "صنة", "ندل", "حيوان", "علوي", "ابو بكر", "بكر", "بكري", "شرموط", "شرموطة", "عاهرة"];
    function checkProfanity(text) {
        const lowerText = text.toLowerCase();
        for (let word of bannedWords) {
            if (lowerText.includes(word)) { return true; }
        }
        return false;
    }

    async function triggerNotification(title, body, imageUrl = null) {
        if ("Notification" in window && Notification.permission === "granted") {
            const notificationOptions = {
                body: body,
                icon: "https://i.ibb.co/23cTDk18/1782795963942.png",
                badge: "https://i.ibb.co/23cTDk18/1782795963942.png",
                image: imageUrl ? imageUrl : undefined,
                vibrate: [200, 100, 200]
            };

            if ('serviceWorker' in navigator) {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    reg.showNotification(title, notificationOptions);
                } catch (e) {
                    new Notification(title, { body: body, icon: notificationOptions.icon });
                }
            } else {
                new Notification(title, { body: body, icon: notificationOptions.icon });
            }
        }
    }

    function linkify(text) {
        if (!text) return '';
        const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        const wwwPattern = /(^|[^\/])(www\.[\S]+(\b|$))/g;
        
        let html = text;
        html = html.replace(urlPattern, function(match) {
            return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="chat-link" onclick="event.stopPropagation();">${match}</a>`;
        });
        html = html.replace(wwwPattern, function(match, p1, p2) {
            return `${p1}<a href="http://${p2}" target="_blank" rel="noopener noreferrer" class="chat-link" onclick="event.stopPropagation();">${p2}</a>`;
        });
        return html;
    }

    function attachLongPressListener(element, textToCopy) {
        let pressTimer;
        const startPress = (e) => {
            if (e.type === "click" || (e.touches && e.touches.length > 1)) return;
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) { navigator.vibrate(50); }
                showCustomContextMenu(e, textToCopy);
            }, 1000); 
        };
        const cancelPress = () => { clearTimeout(pressTimer); };

        element.addEventListener("touchstart", startPress, { passive: true });
        element.addEventListener("touchend", cancelPress);
        element.addEventListener("touchmove", cancelPress);
        element.addEventListener("mousedown", startPress);
        element.addEventListener("mouseup", cancelPress);
        element.addEventListener("mouseleave", cancelPress);
    }

    function showCustomContextMenu(e, text) {
        e.preventDefault();
        removeContextMenu();

        const menu = document.createElement("div");
        menu.className = "custom-context-menu";
        
        const item = document.createElement("div");
        item.className = "context-menu-item";
        item.innerText = "نسخ الرسالة";
        item.onclick = () => {
            navigator.clipboard.writeText(text).then(() => { alert("تم نسخ نص الرسالة بنجاح!"); });
            removeContextMenu();
        };

        menu.appendChild(item);
        document.body.appendChild(menu);

        let posX = e.pageX || (e.touches ? e.touches[0].pageX : 0);
        let posY = e.pageY || (e.touches ? e.touches[0].pageY : 0);

        menu.style.left = `${posX}px`;
        menu.style.top = `${posY}px`;

        activeContextMenu = menu;
        setTimeout(() => { document.addEventListener("click", removeContextMenuOutside); }, 10);
    }

    function removeContextMenu() {
        if (activeContextMenu) {
            activeContextMenu.remove();
            activeContextMenu = null;
        }
        document.removeEventListener("click", removeContextMenuOutside);
    }

    function removeContextMenuOutside(e) {
        if (activeContextMenu && !activeContextMenu.contains(e.target)) {
            removeContextMenu();
        }
    }

    function generateReferralCode(username) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let randomString = '';
        for (let i = 0; i < 4; i++) { randomString += chars.charAt(Math.floor(Math.random() * chars.length)); }
        const cleanUsername = username.replace(/\s+/g, '').substring(0, 3).toLowerCase();
        return `${cleanUsername}-${randomString}`;
    }

    const supabaseUrl = 'https://penavltenjklmpovdgcm.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlbmF2bHRlbmprbG1wb3ZkZ2NtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4ODcxNTQsImV4cCI6MjA5OTQ2MzE1NH0.IchDJ9w3UDF1nxZwvoGacxB6O_hdDOgpcKfTM39mrd4';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let isSignUp = false;
    let myProfile = null;
    let isSavingUser = false;
    let isChatLocked = false;
    let activeSupportRoomId = null;
    let currentActivePage = 'chat'; 
    let tempUserDataAfterSignUp = null; 

    function log(text) {
        const m = document.getElementById('monitor');
        if (m) { 
            m.innerHTML += "<br>> " + text; 
            m.scrollTop = m.scrollHeight; 
        }
    }

    function copyFcmTokenFromMonitor() {
        if (!latestCapturedFcmToken) {
            alert('لم يتم رصد التوكن بعد، يرجى الانتظار قليلاً حتى يظهر في شاشة المراقبة.');
            return;
        }
        navigator.clipboard.writeText(latestCapturedFcmToken).then(() => {
            alert('تم نسخ توكن FCM بنجاح! 🎉');
        }).catch(err => {
            alert('تعذر النسخ التلقائي، يمكنك تحديده يدوياً من صندوق المراقبة.');
        });
    }

    window.onload = async function() {
        log("بدء تشغيل التطبيق وفحص الجلسة...");
        checkReferralInURL();

        try {
            const { data, error } = await _supabase.auth.getSession();
            if (error) { log("خطأ جلسة: " + error.message); return; }
            if (data && data.session) {
                log("تم العثور على جلسة نشطة.");
                checkUserSession(data.session.user.id);
            } else { log("لا توجد جلسة معلقة."); }
        } catch (e) { log("خطأ بالإقلاع: " + e.message); }
    };

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); }
        return outputArray;
    }

    async function saveTokenToDatabase(tokenString) {
        if (!myProfile || !tokenString) return;
        try {
            latestCapturedFcmToken = tokenString;
            
            const { error } = await _supabase
                .from('profiles')

    async function setupPushToken() {
        if (!myProfile || !('serviceWorker' in navigator)) return;
        try {
            const reg = await navigator.serviceWorker.ready;
            if (!reg.pushManager) return;
            
            let sub = await reg.pushManager.getSubscription();
            if (!sub) {
                const publicKeyStr = 'BIP3iY0ubmTuSkHHitbti3-noZBUZKztt9bZv9qbS2c6kpqpLkisNJWgN87MAZ9amSI0_GnpyfqY767Mt9B1W4';
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(publicKeyStr)
                });
            }
            
            const tokenStr = JSON.stringify(sub);
            await saveTokenToDatabase(tokenStr);
            log("🔔 تم تحديث وربط توكن الإشعارات بنجاح.");
        } catch (e) { log("❌ فشل تفعيل توكن الإشعارات: " + e.message); }
    }

    async function submitAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if(!email || !password) return alert('الرجاء كتابة البريد وكلمة المرور');
        if (password.length < 8) { return alert("عذراً، يجب أن تتكون كلمة المرور من 8 خانات أو أكثر"); }
        
        try {
            if(isSignUp) {
                const { data, error } = await _supabase.auth.signUp({ email, password });
                if(error) { alert(error.message); return; }
                
                if (data && data.user) {
                    tempUserDataAfterSignUp = data.user;
                    await _supabase.auth.signInWithPassword({ email, password });
                    document.getElementById('credentials-inputs').classList.add('hidden');
                    document.getElementById('username-inputs').classList.remove('hidden');
                }
            } else {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if(error) { alert(error.message); return; }
                checkUserSession(data.user.id);
            }
        } catch (e) { log("❌ خطأ: " + e.message); }
    }

    async function saveUsername() {
        if (isSavingUser) return;
        const username = document.getElementById('username').value.trim();
        if(!username) return alert('الرجاء كتابة اسم مستعار');
        
        try {
            isSavingUser = true;
            const { data: existingUser } = await _supabase.from('profiles').select('username').eq('username', username).maybeSingle();

            if (existingUser) {
                alert("عذرا هذا الإسم محجوز بالفعل");
                isSavingUser = false;
                return;
            }
            
            let currentUser = null;
            const { data: sessionData } = await _supabase.auth.getUser();
            if (sessionData && sessionData.user) {
                currentUser = sessionData.user;
            } else if (tempUserDataAfterSignUp) {
                currentUser = tempUserDataAfterSignUp;
            }

            if (!currentUser) {
                alert("حدث خطأ في صلاحية الجلسة، يرجى إعادة تسجيل الدخول لتأكيد الاسم الشخصي.");
                forceClearSession();
                return;
            }

            const myReferralCode = generateReferralCode(username);
            const invitedBy = localStorage.getItem('referred_by') || null;
            localStorage.removeItem('referred_by');
            
            const { error } = await _supabase.from('profiles').upsert({ 
                id: currentUser.id, username: username, email: currentUser.email,
                role: 'موظف', is_banned: false, referral_code: myReferralCode,
                referred_by: invitedBy, referral_count: 0, salary: 0, syriatel_cash: ''
            });
            
            if(error) { alert(error.message); isSavingUser = false; return; }

            const welcomeMessage = `أهلاً بكم في تطبيق [ job syria ] \n\nشارك التطبيق من خلال رابط الإحالة الخاص بك "ستجده في قائمة الإعدادات" \n\nواكسب جوائز ستضاف الى راتبك على كل احالة\n\n^لستم ملزمون بوقت عمل محدد ^`;
            
            await _supabase.from('private_chats').insert({
                sender_id: 'f81b4a91-2416-4c7d-b095-c1cdd9fa6a47', 
                sender_name: 'Team leader',
                username: 'Team leader',
                message_text: welcomeMessage,
                role: 'مدير', 
                room_id: currentUser.id, 
                is_read: false 
            });

            if (invitedBy) { await processReferralReward(invitedBy); }
            
            tempUserDataAfterSignUp = null;
            checkUserSession(currentUser.id);
        } catch (e) { log("❌ خطأ بحفظ الاسم: " + e.message); } 
        finally { isSavingUser = false; }
    }

    async function processReferralReward(refCode) {
        try {
            log("🔄 جاري معالجة مكافأة الإحالة للكود: " + refCode);
            const rewardAmount = 2500;
            const { error: rpcError } = await _supabase.rpc('add_referral_reward', { ref_code: refCode, reward_amount: rewardAmount });

            if (!rpcError) { log("✅ تمت إضافة مكافأة الإحالة بنجاح!"); return; }

            const { data: inviter, error } = await _supabase.from('profiles').select('id, salary, referral_count').eq('referral_code', refCode).maybeSingle();
            if (error) return;

            if (inviter) {
                const newSalary = (parseFloat(inviter.salary) || 0) + rewardAmount;
                const newCount = (parseInt(inviter.referral_count) || 0) + 1;
                await _supabase.from('profiles').update({ salary: newSalary, referral_count: newCount }).eq('id', inviter.id);
            }
        } catch (err) { log("❌ خطأ بنظام الإحالة: " + err.message); }
    }

    async function checkUserSession(uid) {
        try {
            let { data: profile, error } = await _supabase.from('profiles').select().eq('id', uid).maybeSingle();
            if(error) return;

            if(!profile) {
                document.getElementById('credentials-inputs').classList.add('hidden');
                document.getElementById('username-inputs').classList.remove('hidden');
                return;
            }

            if (profile.is_banned) {
                alert("تم حظر حسابك من دخول التطبيق من قبل الإدارة!");
                forceClearSession();
                return;
            }

            if (!profile.referral_code) {
                const newGeneratedCode = generateReferralCode(profile.username);
                await _supabase.from('profiles').update({ referral_code: newGeneratedCode, referral_count: 0 }).eq('id', uid);
                const { data: updatedProfile } = await _supabase.from('profiles').select().eq('id', uid).single();
                profile = updatedProfile;
            }
            
            myProfile = profile;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            
            document.getElementById('my-salary').innerText = profile.salary || 0;
            document.getElementById('my-referrals-count').innerText = profile.referral_count || 0;
            document.getElementById('new-username').value = profile.username;
            
            if(profile.syriatel_cash) { document.getElementById('syriatel-cash-input').value = profile.syriatel_cash; }

            const isStaff = ['مشرف', 'مدير', 'مدير مالي'].includes(profile.role);

            if (isStaff) {
                const { data: unreadForAdmin } = await _supabase.from('private_chats').select('id').eq('is_read', false).neq('role', 'مدير').neq('role', 'مشرف').neq('role', 'مدير مالي').limit(1);
                if (unreadForAdmin && unreadForAdmin.length > 0) {
                    document.getElementById('support-badge').classList.remove('hidden');
                }
            } else {
                activeSupportRoomId = myProfile.id; 
                await checkUnreadSupportNotification(myProfile.id);
            }

            if(isStaff) {
                document.getElementById('chat-admin-panel').classList.remove('hidden');
                document.getElementById('nav-admin').classList.remove('hidden');
                loadAdminPanel();
            }

            await loadSupportRoomsSelector();

            setupChatRealtime();
            setupSupportRealtime();
            listenToChatSettings();
            listenToBans(uid);
            loadEmployeeCount(); 
            setupPushToken();
            
            if (latestCapturedFcmToken) {
                await saveTokenToDatabase(latestCapturedFcmToken);
            }
        } catch(e) { log("❌ خطأ فحص الحساب: " + e.message); }
    }

    function applyChatLockState(locked) {
        isChatLocked = locked;
        const statusLbl = document.getElementById('chat-status-lbl');
        const toggleBtn = document.getElementById('toggle-chat-btn');
        const inputField = document.getElementById('msg-text');
        const sendBtn = document.getElementById('send-msg-btn');
        const isStaff = ['مشرف', 'مدير', 'مدير مالي'].includes(myProfile?.role);

        if(locked) {
            if(statusLbl) { statusLbl.innerText = "مغلقة 🔒"; statusLbl.style.color = "var(--red)"; }
            if(toggleBtn) toggleBtn.innerText = "فتح الدردشة 🔓";
            if(!isStaff) {
                inputField.disabled = true;
                inputField.placeholder = "الدردشة مغلقة مؤقتاً من قبل الإدارة";
                sendBtn.disabled = true;
            }
        } else {
            if(statusLbl) { statusLbl.innerText = "مفتوحة 🔓"; statusLbl.style.color = "var(--green)"; }
            if(toggleBtn) toggleBtn.innerText = "قفل الدردشة 🔒";
            inputField.disabled = false;
            inputField.placeholder = "اكتب رسالتك...";
            sendBtn.disabled = false;
        }
    }

    async function toggleChatLockState() {
        const isStaff = ['مشرف', 'مدير', 'مدير مالي'].includes(myProfile?.role);

    async function loadSupportRoomsSelector() {
        const selector = document.getElementById('support-room-selector');
        const label = document.getElementById('support-selector-label');
        if(!selector || !myProfile) return;

        const isStaff = ['مشرف', 'مدير', 'مدير مالي'].includes(myProfile.role);

        if (isStaff) {
            if(label) label.innerText = "اختر غرفة العميل أو الإرسال الجماعي:";
            const { data: users } = await _supabase.from('profiles').select('id, username').eq('role', 'موظف');
            
            let unreadRooms = new Set();
            try {
                const { data: unreadData } = await _supabase.from('private_chats').select('room_id, sender_id').eq('is_read', false);
                if (unreadData) {
                    unreadData.forEach(msg => {
                        const rId = String(msg.room_id).trim().toLowerCase();
                        const sId = String(msg.sender_id).trim().toLowerCase();
                        if (sId === rId) unreadRooms.add(rId);
                    });
                }
            } catch (e) {}

            let broadcastOptionHtml = `<option value="broadcast_all" class="option-broadcast">📢 رسالة جماعية لكل المستخدمين</option>`;
            
            if(users && users.length > 0) {
                const currentSelected = activeSupportRoomId || users[0].id;
                const userOptionsHtml = users.map(u => {
                    const userIdClean = String(u.id).trim().toLowerCase();
                    const activeRoomClean = activeSupportRoomId ? String(activeSupportRoomId).trim().toLowerCase() : '';
                    const hasUnread = unreadRooms.has(userIdClean) && userIdClean !== activeRoomClean;
                    const dot = hasUnread ? ' 🔴' : '';
                    return `<option value="${u.id}" ${u.id === currentSelected ? 'selected' : ''}>${u.username}${dot}</option>`;
                }).join('');

                selector.innerHTML = broadcastOptionHtml + userOptionsHtml;
                
                if(!activeSupportRoomId) { 
                    activeSupportRoomId = currentSelected; 
                    if(activeSupportRoomId !== 'broadcast_all') {
                        await markRoomAsRead(activeSupportRoomId);
                    }
                }
            } else {
                selector.innerHTML = broadcastOptionHtml + '<option value="">لا يوجد موظفين مسجلين حالياً</option>';
            }
        } else {
            if(label) label.innerText = "اختر المسؤول الذي ترغب بالتحدث معه:";
            const { data: admins } = await _supabase.from('profiles').select('id, username, role').in('role', ['مدير', 'مشرف', 'مدير مالي']);
            const savedSelectedAdmin = selector.value;

            if(admins && admins.length > 0) {
                selector.innerHTML = admins.map(a => {
                    const isSelected = savedSelectedAdmin ? (savedSelectedAdmin === a.id) : false;
                    return `<option value="${a.id}" ${isSelected ? 'selected' : ''}>${a.username} (${a.role})</option>`;
                }).join('');
                if (!activeSupportRoomId || activeSupportRoomId === myProfile.id) {
                    activeSupportRoomId = myProfile.id;
                }
            } else {
                selector.innerHTML = `<option value="${myProfile.id}">فريق الدعم الفني</option>`;
                activeSupportRoomId = myProfile.id;
            }
        }
    }

        }

        let { data } = await _supabase.from('private_chats').select('*').eq('room_id', roomId).order('created_at');
        box.innerHTML = '';
        if(data) { data.forEach(msg => appendMessage(msg, 'support-box')); }
    }

    async function setupSupportRealtime() {
        const box = document.getElementById('support-box');
        if(!box || !activeSupportRoomId) return;

        const isStaff = ['مدير', 'مشرف', 'مدير مالي'].includes(myProfile.role);

        if (currentActivePage === 'support' && activeSupportRoomId === myProfile.id) {
            await markRoomAsRead(activeSupportRoomId);
        }
        
        await loadSupportMessages(activeSupportRoomId);

        _supabase.channel('private_chats_global_channel').unsubscribe();

        _supabase.channel('private_chats_global_channel')
            .on('postgres_changes', { event: 'INSERT', table: 'private_chats' }, async p => {
                const newMsg = p.new;
                const isSenderStaff = ['مدير', 'مشرف', 'مدير مالي'].includes(newMsg.role);
                
                if (newMsg.room_id === activeSupportRoomId && activeSupportRoomId !== 'broadcast_all') {
                    appendMessage(newMsg, 'support-box');
                    if (newMsg.sender_id !== myProfile.id && currentActivePage === 'support') {
                        await markRoomAsRead(activeSupportRoomId);
                    }
                } 

                if (newMsg.sender_id !== myProfile.id) {
                    if (!isStaff && newMsg.room_id === myProfile.id && isSenderStaff) {
                        triggerNotification(`رسالة هامة من الإدارة 🔔`, newMsg.message_text || "أرسل صورة 📷", newMsg.image_url);
                    }
                    else if (isStaff && !isSenderStaff) {
                        if (newMsg.room_id !== activeSupportRoomId || document.hidden) {
                            triggerNotification(`دعم فني من: ${newMsg.sender_name}`, newMsg.message_text || "أرسل صورة 📷", newMsg.image_url);
                        }
                    }
                }

                if (newMsg.sender_id !== myProfile.id) {
                    if (isStaff && newMsg.room_id !== activeSupportRoomId && !isSenderStaff) {
                        document.getElementById('support-badge').classList.remove('hidden');
                        await loadSupportRoomsSelector();
                    } else if (!isStaff && newMsg.room_id === myProfile.id && currentActivePage !== 'support') {
                        document.getElementById('support-badge').classList.remove('hidden');
                    }
                }
            })
            .on('postgres_changes', { event: 'UPDATE', table: 'private_chats' }, async p => {
                const updatedMsg = p.new;
                if (updatedMsg.room_id === activeSupportRoomId && activeSupportRoomId !== 'broadcast_all') {
                    await loadSupportMessages(activeSupportRoomId);
                }
            })
            .subscribe();
    }

    function appendMessage(msg, boxId) {
        const box = document.getElementById(boxId);
        if(box) {
            const isGreenRole = msg.username === "Team leader" || msg.sender_name === "Team leader" || msg.role === "مدير" || msg.role === "مشرف" || msg.role === "مدير مالي";
            const userClass = isGreenRole ? "msg-user msg-green" : "msg-user";
            
            const textRaw = msg.message_text || '';
            const processedText = linkify(textRaw);
            
            let content = msg.message_text ? `<div>${processedText}</div>` : '';
            if(msg.image_url) {
                content += `<img src="${msg.image_url}" class="chat-img" alt="صورة مرفقة" onclick="window.open('${msg.image_url}', '_blank')">`;
            }
            
            let checkmark = '';
            if (boxId === 'support-box' && msg.sender_id === myProfile.id) {
                checkmark = msg.is_read 
                    ? ' <span style="color: #34c759; font-size: 11px; margin-right: 5px; font-weight: bold;">✔️✔️</span>' 
                    : ' <span style="color: #888; font-size: 11px; margin-right: 5px; font-weight: bold;">✔️</span>';
            }
            
            const displayName = msg.username || msg.sender_name || "مستخدم";
            
            const msgElement = document.createElement('div');
            msgElement.className = 'msg';
            msgElement.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="${userClass}">${displayName}</span>
                    ${checkmark}
                </div>
                ${content}
            `;
            
            attachLongPressListener(msgElement, textRaw);
            box.appendChild(msgElement);
            box.scrollTop = box.scrollHeight;
        }
    }

    async function updateUsername() {
        const newName = document.getElementById('new-username').value.trim();
        if(!newName) return;
        const { error } = await _supabase.from('profiles').update({ username: newName }).eq('id', myProfile.id);
        if(error) alert('الاسم مستخدم مسبقاً');
        else { alert('تم التحديث!'); location.reload(); }
    }

    function logout() { forceClearSession(); }
    
    async function loadAdminPanel() {
        const { data } = await _supabase.from('profiles').select().order('username');
        const listDiv = document.getElementById('employees-list');
        listDiv.innerHTML = '';
        
        if(data) {
            let totalEmployees = 0; let totalAdmins = 0;
            data.forEach(emp => {
                const role = emp.role || 'موظف';
                if(role === 'موظف' || role === 'User') { totalEmployees++; } else { totalAdmins++; }
            });

            listDiv.innerHTML += `
                <div style="background: #1a1a1a; border: 1px solid var(--gold); padding: 12px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-around; text-align: center;">
                    <div>
                        <div style="font-size: 11px; color: #888; margin-bottom: 4px;">👥 الموظفين</div>
                        <div style="font-size: 18px; color: var(--gold); font-weight: bold;">${totalEmployees}</div>
                    </div>
                    <div style="border-left: 1px solid #333; height: 35px; align-self: center;"></div>
                    <div>
                        <div style="font-size: 11px; color: #888; margin-bottom: 4px;">🛡️ المشرفين والمدراء</div>
                        <div style="font-size: 18px; color: #00ff00; font-weight: bold;">${totalAdmins}</div>
                    </div>
                    <div style="border-left: 1px solid #333; height: 35px; align-self: center;"></div>
                    <div>
                        <div style="font-size: 11px; color: #888; margin-bottom: 4px;">📊 الإجمالي</div>
                        <div style="font-size: 18px; color: #fff; font-weight: bold;">${data.length}</div>
                    </div>
                </div>`;

            data.forEach(emp => {
                const isUserBanned = emp.is_banned === true;
                const userRole = emp.role || 'موظف';
                
                const isManager = myProfile.role === 'مدير';
                const isFinancialManager = myProfile.role === 'مدير مالي';
                const isSupervisor = myProfile.role === 'مشرف';
                const isTargetEmployee = userRole === 'موظف';

                const roleSelector = isManager ? `
                    <select onchange="updateUserRole('${emp.id}', this.value)" style="width:auto; padding: 4px; font-size:11px; margin-top:5px; display:inline-block; height: auto; margin-bottom:0; margin-left: 5px;">
                        <option value="موظف" ${userRole === 'موظف' ? 'selected' : ''}>موظف</option>
                        <option value="مشرف" ${userRole === 'مشرف' ? 'selected' : ''}>مشرف</option>
                        <option value="مدير مالي" ${userRole === 'مدير مالي' ? 'selected' : ''}>مدير مالي</option>
                        <option value="مدير" ${userRole === 'مدير' ? 'selected' : ''}>مدير</option>
                    </select>
                ` : '';

                let banBtn = '';
                if (isManager || (isSupervisor && isTargetEmployee)) {
                    const actionLabel = isUserBanned ? '🔓 فك الحظر' : '🚫 حظر وطرد';
                    const actionColor = isUserBanned ? 'background-color: var(--green); color: white;' : 'background-color: var(--red); color: white;';
                    banBtn = `<button onclick="toggleUserBan('${emp.id}', ${isUserBanned})" style="width:auto; font-size:11px; margin-top:5px; ${actionColor}">${actionLabel}</button>`;
                }

                let salaryModifierArea = '';
                if (isManager || isFinancialManager) {
                    salaryModifierArea = `
                        <div style="margin-top: 8px; display: flex; gap: 4px; align-items: center;">
                            <input type="number" id="salary-input-${emp.id}" value="${emp.salary || 0}" style="width: 100px; padding: 4px; font-size: 12px; margin: 0; background: #333; border: 1px solid var(--gold); text-align: center;">
                            <button onclick="updateUserSalary('${emp.id}')" style="width: auto; padding: 4px 10px; font-size: 11px; background-color: var(--green); color: white;">💾 حفظ الراتب</button>
                        </div>
                    `;
                }

                listDiv.innerHTML += `
                    <div class="admin-card" style="${isUserBanned ? 'border-color: var(--red); opacity: 0.8;' : ''}">
                        <strong>${emp.username}</strong> ${isUserBanned ? '<span style="color:var(--red); font-weight:bold;">(محظور)</span>' : ''}<br>
                        الرتبة: <span style="color: var(--gold); font-weight:bold;">${userRole}</span><br>
                        الراتب الحالي: ${emp.salary || 0} ل.س<br>
                        إحالاته: ${emp.referral_count || 0}<br>
                        كود دعوته: ${emp.referral_code || 'غير منشأ'}<br>
                        سيريتل كاش: ${emp.syriatel_cash || 'لم يربط بعد'}<br>
                        ${salaryModifierArea}
                        <div style="margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; align-items:center;">
                            ${roleSelector}
                            ${banBtn}
                        </div>
                    </div>`;
            });
        }
    }

    async function updateUserSalary(id) {
        const inputField = document.getElementById(`salary-input-${id}`);
        if (!inputField) return;
        
        const newSalary = parseFloat(inputField.value);
        if (isNaN(newSalary) || newSalary < 0) return alert("الرجاء إدخال قيمة راتب صحيحة!");

        if (myProfile.role !== 'مدير' && myProfile.role !== 'مدير مالي') {
            return alert("عذراً، رتبة مدير أو مدير مالي فقط من تملك صلاحية تعديل الرواتب!");
        }

        try {
            const { error } = await _supabase.from('profiles').update({ salary: newSalary }).eq('id', id);
            if (error) { alert("فشل تحديث الراتب: " + error.message); } 
            else {
                alert("تم تحديث وحفظ الراتب بنجاح! 🎉");
                loadAdminPanel(); 
            }
        } catch(e) { alert("خطأ أثناء العملية: " + e.message); }
    }
    
    async function toggleUserBan(id, currentBanStatus) {
        const confirmMsg = currentBanStatus ? "هل أنت متأكد من فك حظر هذا المستخدم؟" : "هل أنت متأكد من حظر وطرد هذا المستخدم من التطبيق؟";
        if (confirm(confirmMsg)) {
            const { error } = await _supabase.from('profiles').update({ is_banned: !currentBanStatus }).eq('id', id);
            if (error) alert("خطأ في تعديل حالة الحظر: " + error.message);
            else { alert("تم تحديث حالة الحظر بنجاح!"); loadAdminPanel(); }
        }
    }

    async function updateUserRole(id, newRole) {
        if (myProfile.role !== 'مدير') { return alert("عذراً، رتبة مدير فقط هي من تمتلك صلاحية تعديل رتب الموظفين!"); }
        const { error = null } = await _supabase.from('profiles').update({ role: newRole }).eq('id', id);
        if (error) alert(error.message);
        else { alert("تم تعديل رتبة المستخدم بنجاح!"); loadAdminPanel(); }
    }

    function logToScreen(message) {
        console.log(message);
        const debugBox = document.getElementById('monitor');
        if (debugBox) {
            debugBox.innerHTML += `<br> > ${message}`;
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        setTimeout(async () => {
            try {
                if (window.Capacitor && window.Capacitor.isPluginAvailable('PushNotifications')) {
                    const PushNotifications = window.Capacitor.Plugins.PushNotifications;

                    await PushNotifications.createChannel({
                        id: 'fcm_default_channel',
                        name: 'Default Channel',
                        importance: 5,
                        visibility: 1
                    });

                    let permStatus = await PushNotifications.checkPermissions();
                    if (permStatus.receive === 'prompt' || permStatus.receive === 'prompt-with-rationale') {
                        permStatus = await PushNotifications.requestPermissions();
                    }

                    if (permStatus.receive === 'granted') {
                        await PushNotifications.register();
                        logToScreen("تم منح إذن الإشعارات بنجاح");
                    } else {
                        logToScreen("تم رفض إذن الإشعارات");
                    }

                    PushNotifications.addListener('registration', async (token) => {
                        latestCapturedFcmToken = token.value;
                        logToScreen("رمز FCM الخاص بالجهاز:");
                        logToScreen(token.value);
                        
                        await saveTokenToDatabase(token.value);
                    });

                    PushNotifications.addListener('registrationError', (err) => {
                        logToScreen("خطأ في التسجيل: " + JSON.stringify(err));
                    });

                    PushNotifications.addListener('pushNotificationReceived', (notification) => {
                        logToScreen("وصل إشعار: " + notification.title);
                    });

                } else {
                    logToScreen("إضافة PushNotifications غير متوفرة (وضع المتصفح)");
                }
            } catch (e) {
                logToScreen("خطأ في النظام: " + e.message);
            }
        }, 1500);
    });
</script>
